
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Radio WebSocket Sincronizzata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            background-color: #2b2b40;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        h1 { color: #ff4757; }
        .status { margin: 15px 0; font-weight: bold; color: #2ed573; }
        .track-info { font-size: 1.2em; margin: 20px 0; color: #ffa502; }
        audio { width: 100%; margin-top: 20px; }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #ff6b81; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📻 Web Radio Live</h1>
        <p id="status" class="status">Connessione al server in corso...</p>
        
        <div class="track-info">
            In Onda: <span id="trackTitle">Nessun brano</span>
        </div>

        <!-- Lettore Audio HTML5 standard -->
        <audio id="audioPlayer" controls></audio>
        
        <br>
        <!-- Bottone opzionale per inviare comandi al server -->
        <button id="skipBtn">⏭️ Salta Canzone (Richiesta DJ)</button>
    </div>
    <script>
        // Rileviamo automaticamente l'host e colleghiamo il WebSocket alla stessa porta
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsUrl = protocol + window.location.host;
        const ws = new WebSocket(wsUrl);

        const statusEl = document.getElementById('status');
        const trackTitleEl = document.getElementById('trackTitle');
        const audioPlayer = document.getElementById('audioPlayer');
        const skipBtn = document.getElementById('skipBtn');

        // EVENTO 1: Apertura Connessione
        ws.onopen = () => {
            statusEl.innerText = "🟢 Connesso alla Web Radio Sincronizzata";
        };

        // EVENTO 2: Ricezione Messaggio dal Server DJ
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                // Aggiorniamo il titolo del brano a schermo
                if (data.title) {
                    trackTitleEl.innerText = data.title;
                }

                // Se la canzone mandata dal server è diversa da quella del player, la cambiamo
                if (data.track && !audioPlayer.src.endsWith(data.track)) {
                    audioPlayer.src = data.track;
                    // I browser bloccano l'autoplay senza interazione: l'utente deve premere play la prima volta
                    audioPlayer.play().catch(() => {
                        console.log("Interazione richiesta per attivare l'audio.");
                    });
                }

                // SINCRONIZZAZIONE TEMPO:
                // Se la differenza tra il player locale ed il server è maggiore di 1.5 secondi, riallineiamo
                if (data.currentTime !== undefined && Math.abs(audioPlayer.currentTime - data.currentTime) > 1.5) {
                    audioPlayer.currentTime = data.currentTime;
                }

            } catch (err) {
                console.error("Errore durante la lettura del messaggio JSON:", err);
            }
        };

        // EVENTO 3: Chiusura della connessione
        ws.onclose = () => {
            statusEl.innerText = "🔴 Disconnesso dal server radio.";
            statusEl.style.color = "#ff4757";
        };

        // EVENTO 4: Gestione errori
        ws.onerror = (err) => {
            console.error("Errore WebSocket:", err);
        };

        // INVIO COMANDO CLIENT -> SERVER (ws.send):
        skipBtn.addEventListener('click', () => {
            if (ws.readyState === WebSocket.OPEN) {
                const msg = { action: 'skip' };
                ws.send(JSON.stringify(msg));
            }
        });
    </script>
</body>
</html>
